# Services (aka containers)
services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: on-failure
    secrets:
      - db_user_password
      - db_root_password
    environment:
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$(cat /run/secrets/db_root_password)"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 4s

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure
    secrets:
      - wp_user_password
      - wp_admin_password
      - db_user_password
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - WP_ADMIN=${WP_ADMIN}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm8.2"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 8s

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    depends_on:
      wordpress:
        condition: service_healthy
    restart: on-failure
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
  

# Networks (for communication between services / containers)
networks:
  inception:
    driver: bridge
    name: inception


# Volumes (for persistant data)
volumes:
  wordpress:
    name: wordpress_volume
    driver: local
    driver_opts:
      device: ${HOME}/data/wordpress
      type: none
      o: bind

  mariadb:
    name: mariadb_volume
    driver: local
    driver_opts:
      device: ${HOME}/data/mariadb
      type: none
      o: bind

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_user_password:
    file: ../secrets/db_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt